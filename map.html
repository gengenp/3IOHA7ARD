  --room-attraction-fill: #d3e8f7;
  --room-attraction-stroke:#0072b2; /* blue */

  --room-target-stroke:   #d55e00; /* vermillion */
  --accent: var(--room-attraction-stroke);
  --accent-soft: var(--room-attraction-fill);

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ overflow-x:hidden; max-width:100%; }
body{
  background:var(--bg);

a{ color:inherit; text-decoration:none; }

header{

.brand{

.back-link{

/* ---- floor tabs ---- */
.floor-tabs{
  display:flex; gap:.5rem; padding:.7rem 4vw;
  border-bottom:1px solid var(--border);

.floor-tab{
  font-weight:700; font-size:.85rem;
  padding:.5rem 1.1rem; border:1px solid var(--border); border-radius:8px; color:var(--ink-dim);

}
.floor-tab.active{ color:#fff; background:var(--accent); border-color:var(--accent); }

/* ---- map viewport ---- */

  width:100%;

  overflow:hidden;
  background:var(--surface);
  touch-action:none;
}
.map-stage{
  position:absolute; top:0; left:0;
  transform-origin:0 0;
  will-change:transform;
}
.map-stage svg{ display:block; }

/* stroke-widthはSVG内部座標系(1300x800)基準。太くしてはっきり見えるようにしている */

/* ==========================================================================
   1. Figmaのidエンコード崩れを復元するデコーダー
   ========================================================================== */
function decodeMojibakeId(str){
  const bytes = [];
  for (const ch of str){
    const code = ch.codePointAt(0);
    if (code < 256){
      bytes.push(code);
    } else {
      bytes.push(...new TextEncoder().encode(ch));
    }
  }
  return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
}

/* ==========================================================================
   2. プレフィックス判定
   b / e = 通路（クリック無効）
   c     = 使用しない部屋（シンプルポップアップ）
   d     = 設備・階段（クリック無効）
   それ以外 = アトラクション（カード型ポップアップ）
   ========================================================================== */
function classify(name){
  const p = name.charAt(0);
  if (p === 'b' || p === 'e') return 'corridor';
  if (p === 'c') return 'unused';
  if (p === 'd') return 'equip';
  return 'attraction';
}

/* ==========================================================================
   5. フロア読み込み（fetch + DOMParser。インライン埋め込みは絶対にしない）
   ========================================================================== */
const FLOOR_FILES = { '1F':'assets/floors/1F.svg', '2F':'assets/floors/2F.svg', '3F':'assets/floors/3F.svg', '4F':'assets/floors/4F.svg' };
const floorCache = {};
let currentFloor = null;
let clickableEls = []; // {el, name, kind, cx, cy}

async function loadFloor(floorKey){
  const stage = document.getElementById('mapStage');
  currentFloor = floorKey;

  document.querySelectorAll('.floor-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.floor === floorKey);
  });

  let svgEl;
  if (floorCache[floorKey]){
    svgEl = floorCache[floorKey];
  } else {
    const res = await fetch(FLOOR_FILES[floorKey]);
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    svgEl = doc.documentElement;
    floorCache[floorKey] = svgEl;
  }

  stage.innerHTML = '';
  const svgClone = svgEl.cloneNode(true);
  stage.appendChild(svgClone);

  // 「フロア全体を包む最外周のg」は除外する（一階/二階/三階/四階というidが付いている）
  const FLOOR_WRAPPER_NAMES = new Set(['一階','二階','三階','四階']);
  // 例外設定
  // ・アトラクションが無いことが判明した部屋は、bグループ同様クリック不可の通路扱いにする
  const FORCE_CORRIDOR_NAMES = new Set(['２F中央渡り廊下']);
  // ・通常のルール（正方形以上に横長）に当てはまらなくても、名前を表示したい部屋
  const FORCE_LABEL_NAMES = new Set(['作法室', 'b昇降口']);

  // クリック判定対象を洗い出してスタイル・イベントを付与
  // 単純な図形（rect/path等）だけでなく、複数のpathをまとめた<g id="...">の部屋
  // （例：マスクで縁取りを表現している通路など）にも対応する。
  clickableEls = [];
  const shapeTags = ['rect','path','polygon','circle','ellipse','g'];
  shapeTags.forEach(tag => {
    svgClone.querySelectorAll(tag + '[id]').forEach(el => {
      const rawId = el.getAttribute('id');
      if (/pattern|image|clip|path-/.test(rawId)) return;
      const name = decodeMojibakeId(rawId);
      if (tag === 'g' && FLOOR_WRAPPER_NAMES.has(name)) return; // フロア全体のラッパーは対象外

      const kind = FORCE_CORRIDOR_NAMES.has(name) ? 'corridor' : classify(name);
      el.classList.add('room-' + kind);
      // <g>の場合、子要素が独自のfill属性を持っているため、
      // 子の図形すべてにも同じクラスを付けて塗りつぶし色を確実に上書きする。
      if (tag === 'g'){
        el.querySelectorAll('rect,path,polygon,circle,ellipse').forEach(child => {
          child.classList.add('room-' + kind);
        });
      }

      let bbox;
      try { bbox = el.getBBox(); } catch(e){ bbox = {x:0,y:0,width:0,height:0}; }

      if (kind === 'attraction' || kind === 'unused'){
        const cx = bbox.x + bbox.width/2;
        const cy = bbox.y + bbox.height/2;
        clickableEls.push({ el, name, kind, cx, cy });
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openRoom(name, kind, el);
        });
      }

      // 正方形または横長の部屋は、中央に部屋名を表示する（例外指定の部屋は形に関わらず表示）
      const shouldLabel = FORCE_LABEL_NAMES.has(name) || ((kind === 'attraction' || kind === 'unused') && bbox.width >= bbox.height && bbox.width > 0);
      if (shouldLabel && bbox.width > 0){
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', bbox.x + bbox.width/2);
        label.setAttribute('y', bbox.y + bbox.height/2);
        label.setAttribute('class', 'room-label');
        const fontSize = Math.max(11, Math.min(18, bbox.height * 0.28));
        label.setAttribute('font-size', fontSize);
        label.textContent = ['b','c','d','e'].includes(name.charAt(0)) ? name.slice(1) : name;
        (el.tagName === 'g' ? el : el.parentNode).appendChild(label);
      }
    });
  });

  resetView();
}

/* ==========================================================================
   6. タップミス救済: 空白部分をタップしたら最寄りのクリック可能な部屋を開く
   ========================================================================== */
document.getElementById('mapStage').addEventListener('click', (ev) => {
  if (ev.target.closest('.room-attraction, .room-unused')) return; // 個別ハンドラで処理済み
  const stage = document.getElementById('mapStage');
  const svg = stage.querySelector('svg');
  if (!svg || clickableEls.length === 0) return;
  const pt = svg.createSVGPoint();
  pt.x = ev.offsetX; pt.y = ev.offsetY;
  // stageは transform されているため、逆行列でSVG内部座標に変換
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const rect = stage.getBoundingClientRect();
  const svgPt = svg.createSVGPoint();
  svgPt.x = ev.clientX; svgPt.y = ev.clientY;
  const local = svgPt.matrixTransform(ctm.inverse());
  let best = null, bestDist = Infinity;
  clickableEls.forEach(c => {
    const d = (c.cx - local.x)**2 + (c.cy - local.y)**2;
    if (d < bestDist){ bestDist = d; best = c; }
  });
  // 極端に離れていたら反応しない（画面外タップなどのノイズ防止）
  if (best && bestDist < (300*300)){
    best.el.classList.add('room-flash');
    setTimeout(() => best.el.classList.remove('room-flash'), 500);
    openRoom(best.name, best.kind, best.el);
  }
});

function openRoom(name, kind, el){
  const overlay = document.getElementById('roomOverlay');
  const sheet = document.getElementById('roomSheet');
  if (kind === 'unused'){
    const displayName = name.slice(1); // 先頭の 'c' を除いた部屋名
    sheet.innerHTML = `
      <button class="sheet-close" data-close="roomOverlay">閉じる ✕</button>
      <div class="simple-name">${escapeHTML(displayName)}</div>
      <div class="simple-note">このスペースは今回のアトラクションでは使用していません。</div>
    `;
  } else {
    const infoList = getRoomInfoList(name);
    const cardsHTML = infoList.map(info => `
      <div class="card-block">
        <span class="card-tag">${escapeHTML(info.tag)}</span>
        <div class="card-title">${escapeHTML(info.title)}</div>
        <div class="card-team">団体名：${escapeHTML(info.team)}</div>
        <p class="card-desc">${escapeHTML(info.desc)}</p>
      </div>
    `).join('<hr class="card-divider">');
    sheet.innerHTML = `
      <button class="sheet-close" data-close="roomOverlay">閉じる ✕</button>
      ${cardsHTML}
    `;
  }
  overlay.classList.add('show');
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// data-close属性を持つボタンは、あとから innerHTML で動的に追加されるものも多い
// （openRoom()内で毎回生成される「閉じる」ボタンなど）ため、
// ページ読み込み時に一度だけbindするのではなく、documentに対するイベント委任にする。
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-close]');
  if (btn){
    document.getElementById(btn.dataset.close).classList.remove('show');
  }
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('show'); });
});

/* ==========================================================================
   9. ピンチズーム／パン（スマホ最優先の簡易実装）
   ========================================================================== */
const viewport = document.getElementById('mapViewport');
const stageEl = document.getElementById('mapStage');
let scale = 1, panX = 0, panY = 0;
let minScale = 1, maxScale = 4;
const NATIVE_W = 1300, NATIVE_H = 800;

function resetView(){
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(vw / NATIVE_W, vh / NATIVE_H);
  minScale = scale;
  panX = (vw - NATIVE_W * scale) / 2;
  panY = (vh - NATIVE_H * scale) / 2;
  applyTransform();
}

function clampPan(){
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const contentW = NATIVE_W * scale, contentH = NATIVE_H * scale;
  const minX = Math.min(0, vw - contentW);
  const minY = Math.min(0, vh - contentH);
  panX = Math.max(minX, Math.min(0, panX));
  panY = Math.max(minY, Math.min(0, panY));
  // コンテンツが画面より小さい方向はセンタリング
  if (contentW < vw) panX = (vw - contentW) / 2;
  if (contentH < vh) panY = (vh - contentH) / 2;
}

function applyTransform(){
  clampPan();
  stageEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

// --- ポインター管理 ---
const pointers = new Map();
let pinchStartDist = 0, pinchStartScale = 1;
let panStart = null;

viewport.addEventListener('pointerdown', (e) => {
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1){
    panStart = {x:e.clientX, y:e.clientY, panX, panY};
  } else if (pointers.size === 2){
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartScale = scale;
  }
});

viewport.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (pointers.size === 1 && panStart){
    panX = panStart.panX + (e.clientX - panStart.x);
    panY = panStart.panY + (e.clientY - panStart.y);
    applyTransform();
  } else if (pointers.size === 2){
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if (pinchStartDist > 0){
      const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
      const rect = viewport.getBoundingClientRect();
      const localX = midX - rect.left, localY = midY - rect.top;
      const newScale = Math.max(minScale, Math.min(maxScale, pinchStartScale * (dist / pinchStartDist)));
      // ピンチ中心を軸に拡大縮小
      const contentX = (localX - panX) / scale;
      const contentY = (localY - panY) / scale;
      scale = newScale;
      panX = localX - contentX * scale;
      panY = localY - contentY * scale;
      applyTransform();
    }
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) panStart = null;
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

// マウスホイールでもズームできるように（PC確認用）
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const localX = e.clientX - rect.left, localY = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 0.9;
  const newScale = Math.max(minScale, Math.min(maxScale, scale * factor));
  const contentX = (localX - panX) / scale;
  const contentY = (localY - panY) / scale;
  scale = newScale;
  panX = localX - contentX * scale;
  panY = localY - contentY * scale;
  applyTransform();
}, { passive:false });

window.addEventListener('resize', () => { if (currentFloor) resetView(); });

let currentSchedDay = 1;

function renderSchedule(){
  const grid = document.getElementById('schedGrid');
  const items = SCHEDULE_DATA[currentSchedDay] || [];
  grid.innerHTML = items.map(it => `
    <div class="sched-row">
      <span class="sched-time">${it.time}</span>
      <span>${escapeHTML(it.label)}</span>
    </div>
  `).join('');
  updateLiveLine();
}

function updateLiveLine(){
  const grid = document.getElementById('schedGrid');
  const old = grid.querySelector('.sched-live-line');
  if (old) old.remove();
  const oldLabel = grid.querySelector('.sched-live-label');
  if (oldLabel) oldLabel.remove();

  const items = SCHEDULE_DATA[currentSchedDay] || [];
  if (items.length === 0) return;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const first = toMin(items[0].time);
  const last = toMin(items[items.length-1].time) + 60; // 最終項目のあと1時間分を余白として確保
  if (nowMin < first || nowMin > last) return; // 時程の範囲外なら表示しない

  const rowH = grid.scrollHeight / items.length; // 簡易的な按分（行数ベース）
  const ratio = (nowMin - first) / (last - first);
  const top = ratio * grid.scrollHeight;

  const line = document.createElement('div');
  line.className = 'sched-live-line';
  line.style.top = top + 'px';
  const label = document.createElement('div');
  label.className = 'sched-live-label';
  label.style.top = top + 'px';
  label.textContent = 'NOW ' + now.toTimeString().slice(0,5);
  grid.style.position = 'relative';
  grid.appendChild(line);
  grid.appendChild(label);
}
setInterval(() => { if (document.getElementById('scheduleOverlay').classList.contains('show')) updateLiveLine(); }, 30000);
